# =====================================================================
# LingXiao - Nginx example (HTTP, put TLS in front before going public)
# ---------------------------------------------------------------------
# Install:
#   sudo cp lingxiao.conf /etc/nginx/conf.d/lingxiao.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Expected layout:
#   /opt/lingxiao/web/           <- lx-ui-admin/dist
#   /opt/lingxiao/lingxiao.jar  <- backend on 127.0.0.1:8080
# =====================================================================

upstream lingxiao_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name admin.example.com;

    root /opt/lingxiao/web;
    index index.html;
    charset utf-8;

    # 与后端 spring.servlet.multipart.max-request-size 保持一致
    client_max_body_size 20m;

    # ---------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---------------------------------------------------------------
    # SPA static files
    # ---------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ---------------------------------------------------------------
    # Backend API (login / CRUD / file upload / public files)
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://lingxiao_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------------------------------------------------------------
    # API docs (development / staging only)
    # Production profile disables them; remove this block in prod.
    # ---------------------------------------------------------------
    location ~ ^/(doc\.html|v3/api-docs|swagger-ui|webjars) {
        proxy_pass http://lingxiao_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------
    # Optional: deny direct access to hidden files
    # ---------------------------------------------------------------
    location ~ /\.(?!well-known) {
        deny all;
    }
}

