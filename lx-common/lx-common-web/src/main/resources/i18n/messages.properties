# =====================================================================
# 凌霄 · 后端语言包（默认 = 简体中文）
# ---------------------------------------------------------------------
# 约定：
#   1. 键名只用小写字母、数字、点，前端 vue-i18n 里同名键可直接复用；
#   2. error.<code> 与 ErrorCode 枚举一一对应，枚举里的中文是兜底文案；
#   3. 带占位符的文案用 {0} {1}，由 MessageFormat 替换；
#   4. valid.* 被 Bean Validation 的 message 引用（message = "{valid.x.y}"）；
#   5. 这里不放日志 / 审计文案——那是给运维看的中文，不翻译。
# =====================================================================

# ---------- 通用 ----------
common.listSeparator=；

# ---------- 错误码（与 ErrorCode 对齐） ----------
error.0=操作成功
error.1000=操作失败
error.1001=请求参数不正确
error.1002=未登录或登录已过期
error.1003=没有权限执行该操作
error.1004=资源不存在
error.1005=请求方法不支持
error.1006=请求过于频繁，请稍后再试
error.2001=用户名或密码错误
error.2002=账号已被停用
error.2003=验证码错误或已过期
error.2004=账号已被锁定，请稍后再试
error.2005=原密码不正确
error.3001=文件上传失败
error.3002=文件类型不允许
error.3003=文件超过大小限制
error.3004=文件不存在
error.9000=系统内部错误

# ---------- 带参数的补充错误文案 ----------
error.1005.method=不支持的请求方法：{0}
error.1001.nickname=昵称不能为空
error.1001.samePassword=新密码不能与原密码相同
error.2004.locked=账号已锁定，请 {0} 分钟后再试
error.2004.failures=密码错误次数过多，账号已锁定 {0} 分钟

