# =====================================================================
# LingXiao backend messages (English)
# ---------------------------------------------------------------------
# Rules:
#   1. Keys mirror messages.properties exactly; keep both files in sync.
#   2. error.<code> matches the ErrorCode enum, whose Chinese text is the fallback.
#   3. Placeholders are {0} {1} and are filled by MessageFormat.
#   4. valid.* keys are referenced by Bean Validation (message = "{valid.x.y}").
#   5. Audit / log text is operator-facing Chinese and is intentionally not translated.
#   6. Avoid apostrophes: MessageFormat treats a single quote as an escape character.
# =====================================================================

# ---------- Common ----------
# Trailing "\ " is an escaped space, so the separator stays "; " after loading.
common.listSeparator=;\ 

# ---------- Error codes ----------
error.0=Success
error.1000=Operation failed
error.1001=Invalid request parameters
error.1002=Not signed in or session expired
error.1003=You do not have permission to perform this action
error.1004=Resource not found
error.1005=Request method not supported
error.1006=Too many requests, please try again later
error.2001=Incorrect username or password
error.2002=This account has been disabled
error.2003=Captcha is incorrect or has expired
error.2004=This account is locked, please try again later
error.2005=Current password is incorrect
error.3001=File upload failed
error.3002=File type is not allowed
error.3003=File exceeds the size limit
error.3004=File not found
error.9000=Internal server error

# ---------- Parameterized errors ----------
error.1005.method=Request method not supported: {0}
error.1001.nickname=Nickname must not be empty
error.1001.samePassword=The new password must differ from the current one
error.2004.locked=Account is locked. Please try again in {0} minute(s)
error.2004.failures=Too many failed attempts. The account is locked for {0} minute(s)

